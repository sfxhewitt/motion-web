<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#191b27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "default" (not black-translucent): on iOS 26 standalone, black-translucent sizes the layout viewport as screen minus
     the status bar but anchors it at the top, leaving a dead, untappable ~62px band at the bottom. With "default" the
     web view starts below the status bar (painted with theme-color) and ends exactly at the bottom edge. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kinetic">
<title>KINETIC</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/SpaceGrotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-mode="none">
<div id="app">
  <header id="top">
    <button id="btnBack" class="ib" title="Back" data-testid="btn-back"></button>
    <input id="projName" class="pname m-none" aria-label="Project name" spellcheck="false" data-testid="proj-name">
    <input id="layerName" class="pname lname m-sel" aria-label="Layer name" spellcheck="false" data-testid="layer-name">
    <b id="topTitle" class="m-sub" data-testid="top-title"></b>
    <div class="sp"></div>
    <button id="btnSettings" class="ib m-none" title="Project settings" data-testid="tab-project"></button>
    <button id="btnExport" class="exp m-none" title="Export" aria-label="Export" data-testid="btn-export"></button>
    <button id="btnDup" class="ib m-sel" title="Duplicate layer" data-testid="dup-layer"></button>
    <button id="btnDel" class="ib m-sel" title="Delete layer" data-testid="del-layer"></button>
    <button id="btnMore" class="ib m-sel" title="More" data-testid="layer-more"></button>
    <div id="topSub" class="m-sub"><button id="btnKey" class="ib keyb" title="Keyframe (K)" data-testid="key-all"></button><button id="btnPtAdd" class="ib ptadd" title="Add point" data-testid="pt-add"></button></div>
  </header>
  <main id="stageWrap">
    <div id="stage"><canvas id="view" data-testid="view"></canvas><canvas id="overlay"></canvas></div>
    <button id="btnZoom" class="zb" title="Fit preview" aria-label="Fit preview" data-testid="zoom-fit"></button>
    <div id="zoomHud" class="zhud" data-testid="zoom-hud" aria-live="polite"><span class="zi"></span><b>100%</b></div>
    <div id="sizeModes" class="szms" data-testid="size-modes" hidden></div>
    <div id="modeBadge" class="mbadge" data-testid="mode-badge"></div>
  </main>
  <section id="transport">
    <button id="btnUndo" class="ib" title="Undo" data-testid="undo"></button>
    <button id="btnRedo" class="ib" title="Redo" data-testid="redo"></button>
    <button id="btnStart" class="ib" title="Go to start" data-testid="go-start"></button>
    <button id="btnKPrev" class="ib kfnav m-kf" title="Previous keyframe" data-testid="kf-prev"></button>
    <button id="btnPlay" class="ib play" title="Play / Pause (space)" data-testid="play"></button>
    <button id="btnKNext" class="ib kfnav m-kf" title="Next keyframe" data-testid="kf-next"></button>
    <button id="btnEnd" class="ib" title="Go to end" data-testid="go-end"></button>
    <button id="btnCopy" class="ib" title="Layer actions" data-testid="copy-layer"></button>
    <button id="btnFit" class="ib" title="Full-screen preview" data-testid="fit"></button>
  </section>
  <section id="bottom">
    <section id="timeline"><div id="tlScroll" data-testid="timeline"></div><div id="playhead"></div><div id="tcPill" data-testid="timecode">00:00:00</div></section>
    <aside id="panel" data-testid="panel"></aside>
    <button id="fab" class="fab" title="Add" aria-label="Add layer" data-testid="tab-add"></button>
    <div id="sheet" data-testid="add-sheet" hidden></div>
  </section>
</div>
<section id="home" data-testid="home" hidden>
  <header class="h-top">
    <button id="homeMenu" class="h-ib" title="Menu" aria-label="Menu" data-testid="home-settings"></button>
    <div class="wordmark" aria-label="KINETIC"><svg class="wm-mark" viewBox="0 0 28 22" aria-hidden="true"><path d="M2 17.5C8 18.5 15.5 15 20 7.5" fill="none" stroke="#1e2135" stroke-width="2.6" stroke-linecap="round"/><path d="M8.5 20.5c5.6-.4 11-3.6 14.2-9" fill="none" stroke="#1e2135" stroke-width="1.6" stroke-linecap="round" opacity=".55"/><circle cx="23.2" cy="4.2" r="2.6" fill="#2ee39a"/></svg><span>KINETIC</span></div>
    <button id="homeAvatar" class="h-avatar" title="Account" aria-label="Account" data-testid="home-account"></button>
  </header>
  <div class="h-scroll" id="homeScroll">
    <div id="homeBanner" class="h-banner" data-testid="home-banner">
      <div class="hb-tx"><span class="tag">NEW</span><p>Import a project file from your device</p></div>
      <button id="homeImport" class="hb-btn" data-testid="home-import">Import</button>
      <button id="homeBannerX" class="hb-x" title="Dismiss" aria-label="Dismiss" data-testid="home-banner-close"></button>
    </div>
    <div class="h-pills" data-testid="home-pills"><button class="on" data-testid="pill-projects">Projects</button><button data-soon="Your Templates">Your Templates</button><button data-soon="Elements">Elements</button><button data-soon="Cloud">Cloud<i class="tag">NEW</i></button></div>
    <h2 class="h-head">Your projects</h2>
    <div id="homeList" class="h-list"></div>
  </div>
  <nav class="h-nav" data-testid="home-nav">
    <button class="on" data-nav="home"><span data-ic="home"></span><b>Home</b></button>
    <button data-nav="tutorials" data-soon="Tutorials"><span data-ic="tutorials"></span><b>Tutorials</b></button>
    <span class="h-navgap"></span>
    <button data-nav="projects"><span data-ic="projects"></span><b>Projects</b></button>
    <button data-nav="templates" data-soon="Templates"><span data-ic="templates"></span><b>Templates</b><i class="tag">NEW</i></button>
    <button id="homeNew" class="h-fab" title="Create" aria-label="Create" data-testid="home-new"></button>
  </nav>
</section>
<section id="create" data-testid="create-sheet" hidden></section>
<dialog id="dlg"></dialog>
<input type="file" id="fileMedia" accept="image/*,video/*" hidden data-testid="file-media">
<input type="file" id="fileAudio" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg" hidden data-testid="file-audio">
<input type="file" id="fileJson" accept=".json,application/json" hidden data-testid="file-json">
<input type="color" id="pickColor" hidden>
<script type="module" src="js/main.js"></script>
</body>
</html>
